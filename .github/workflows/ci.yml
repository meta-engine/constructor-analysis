name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore constructor-analysis.sln

      - name: Build
        run: dotnet build constructor-analysis.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test constructor-analysis.sln --configuration Release --no-build
